name: summit-thread-foundation-local

services:
  postgres:
    image: postgres:16.11-alpine
    environment:
      POSTGRES_DB: summit_thread
      POSTGRES_USER: summit_thread
      POSTGRES_PASSWORD: summit_thread_local_only
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5435}:5432"
    volumes:
      - summit_thread_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U summit_thread -d summit_thread"]
      interval: 5s
      timeout: 5s
      retries: 20

  elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:8.19.9
    environment:
      discovery.type: single-node
      xpack.security.enabled: "false"
      ES_JAVA_OPTS: -Xms512m -Xmx512m
    ports:
      - "127.0.0.1:${ELASTICSEARCH_PORT:-9203}:9200"
    volumes:
      - summit_thread_elasticsearch_data:/usr/share/elasticsearch/data
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:9200/_cluster/health >/dev/null"]
      interval: 10s
      timeout: 5s
      retries: 30

volumes:
  summit_thread_postgres_data:
  summit_thread_elasticsearch_data:
