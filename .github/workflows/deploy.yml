name: Deploy to Radar

on:
  push:
    branches: [main]
    paths-ignore:
      - deploy/kustomization.yaml

permissions:
  contents: write
  packages: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ghcr.io/${{ github.repository_owner }}/summit-thread:${{ github.sha }}
            ghcr.io/${{ github.repository_owner }}/summit-thread:main
      - name: Pin the deployed image
        run: |
          sed -i "s/newTag: .*/newTag: $GITHUB_SHA/" deploy/kustomization.yaml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add deploy/kustomization.yaml
          git commit -m "deploy: $GITHUB_SHA [skip ci]"
          git push
