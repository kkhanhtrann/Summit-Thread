name: Deploy to Radar

on:
  push:
    branches: [main]
    paths-ignore:
      - deploy/kustomization.yaml

permissions:
  contents: write
  packages: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ghcr.io/${{ github.repository_owner }}/summit-thread:${{ github.sha }}
            ghcr.io/${{ github.repository_owner }}/summit-thread:main
      - name: Prepare deployment pin
        run: |
          sed -i "s/newTag: .*/newTag: $GITHUB_SHA/" deploy/kustomization.yaml
      - name: Open deployment pull request
        uses: peter-evans/create-pull-request@v7
        with:
          branch: deploy/${{ github.sha }}
          delete-branch: true
          title: "deploy: ${{ github.sha }}"
          commit-message: "deploy: ${{ github.sha }}"
          body: |
            Update the Radar deployment image to `${{ github.sha }}`.

            The image was published by the Deploy to Radar workflow.
