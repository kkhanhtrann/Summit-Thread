name: CI
on:
  push:
    branches: ['**']
  pull_request:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: |
            backend/package-lock.json
            web/package-lock.json
      - run: cp backend/.env.example backend/.env
      - run: cp web/.env.example web/.env.local
      - run: npm run install:all
      - run: npm run services:up
      - run: npm run db:deploy
      - run: docker compose exec -T postgres psql -U summit_thread -d summit_thread -c "CREATE DATABASE summit_thread_shadow"
      - run: SHADOW_DATABASE_URL=postgresql://summit_thread:summit_thread_local_only@127.0.0.1:5435/summit_thread_shadow?schema=public npm run db:check
      - run: npm run check
      - name: Verify durable Ask indexing and recovery
        run: npm --prefix backend run test:search:integration
      - name: Verify runtime readiness
        run: |
          npm --prefix backend start > /tmp/summit-api.log 2>&1 &
          api_pid=$!
          trap 'kill "$api_pid"' EXIT
          for attempt in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:3110/api/health/ready; then exit 0; fi
            sleep 1
          done
          cat /tmp/summit-api.log
          exit 1
      - if: always()
        run: npm run services:down
