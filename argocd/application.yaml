apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: summitthread
  namespace: argocd
spec:
  project: team-summitthread
  source:
    repoURL: https://github.com/kkhanhtrann/Summit-Thread.git
    targetRevision: main
    path: deploy
  destination:
    server: https://kubernetes.default.svc
    namespace: team-summitthread
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
