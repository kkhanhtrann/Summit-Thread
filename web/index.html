<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#0e2a2e" />
    <meta name="description" content="Follow every word of a conference talk, catch up on topics, and ask private questions." />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <title>Summit Thread</title>
    <style>
      .boot-screen {
        min-height: 100vh;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 0.9rem;
        background: #f2faf9;
        color: #0e2a2e;
        font-family: system-ui, sans-serif;
      }
      .boot-screen img { width: 4.5rem; height: auto; }
      .boot-screen strong { font-size: 1.25rem; font-weight: 700; letter-spacing: -0.01em; }
      .boot-screen span:last-child { color: #4a6266; font-size: 0.95rem; }
      .boot-spinner {
        width: 1rem;
        height: 1rem;
        border: 2px solid #0b5f59;
        border-right-color: transparent;
        border-radius: 50%;
        animation: boot-spin 750ms linear infinite;
      }
      @keyframes boot-spin { to { transform: rotate(360deg); } }
      @media (prefers-reduced-motion: reduce) { .boot-spinner { animation: none; } }
    </style>
  </head>
  <body>
    <div id="root">
      <div class="boot-screen" role="status">
        <img src="/favicon.svg" alt="" />
        <strong>Summit Thread</strong>
        <span class="boot-spinner" aria-hidden="true"></span>
        <span>Starting local services</span>
      </div>
    </div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
