<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#f4f1e9" />
    <meta name="description" content="A calmer way to follow a conference talk." />
    <title>Summit Thread — Follow the talk</title>
    <style>
      .boot-screen {
        min-height: 100vh;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 0.85rem;
        background: #f4f1e9;
        color: #202923;
        font-family: sans-serif;
      }
      .boot-screen strong { font-size: 1.2rem; font-weight: 650; }
      .boot-screen span:last-child { color: #526057; font-size: 0.95rem; }
      .boot-spinner {
        width: 1rem;
        height: 1rem;
        border: 2px solid #38684d;
        border-right-color: transparent;
        border-radius: 50%;
        animation: boot-spin 750ms linear infinite;
      }
      @keyframes boot-spin { to { transform: rotate(360deg); } }
      @media (prefers-reduced-motion: reduce) { .boot-spinner { animation: none; } }
    </style>
  </head>
  <body>
    <div id="root">
      <div class="boot-screen" role="status">
        <strong>Summit Thread</strong>
        <span class="boot-spinner" aria-hidden="true"></span>
        <span>Getting the room ready</span>
      </div>
    </div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
